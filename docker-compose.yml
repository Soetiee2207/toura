services:
  db:                              # tên service, tự đặt
    image: postgres:17-alpine      # image Postgres bản 17, loại alpine cho nhẹ
    container_name: toura-db
    restart: unless-stopped        # tự khởi động lại nếu bị crash
    environment:                   # biến môi trường, Postgres đọc để tạo DB lần đầu
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"                # cổng máy bạn : cổng trong container
    volumes:
      - toura_pgdata:/var/lib/postgresql/data   # lưu dữ liệu ra ngoài container

volumes:
  toura_pgdata:
